<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Scenarios</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div style="max-width:900px;margin:0 auto;padding:16px;">
    @if (scenarios().length === 0) {
      <div class="ion-text-center" style="padding:48px 16px;color:var(--ion-color-medium);">
        <ion-icon name="book-outline" color="primary" style="font-size:64px;margin-bottom:16px;opacity:0.5;"></ion-icon>
        <h2>No Scenarios Yet</h2>
        <p>Scenarios let you create rich worlds with multiple characters.</p>
      </div>
    } @else {
      <ion-list lines="full">
        @for (s of scenarios(); track s.id) {
          <ion-item (click)="openScenario(s.id)" style="cursor:pointer;">
            <ion-icon name="book-outline" slot="start" color="primary"></ion-icon>
            <ion-label>
              <h3>{{ s.title }}</h3>
              <p>{{ s.description.slice(0, 100) }}{{ s.description.length > 100 ? '...' : '' }}</p>
            </ion-label>
            <ion-badge slot="end" [color]="s.defaultMode === 'story' ? 'secondary' : 'primary'">{{ s.defaultMode }}</ion-badge>
          </ion-item>
        }
      </ion-list>
    }
  </div>
</ion-content>
