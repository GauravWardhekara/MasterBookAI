name: Regenerate package-lock

on:
  workflow_dispatch: {}

jobs:
  regenerate:
    name: Regenerate package-lock.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Remove existing lockfile
        run: |
          if [ -f package-lock.json ]; then mv package-lock.json package-lock.json.backup; fi

      - name: Install dependencies (generate lockfile)
        run: |
          npm install --no-audit --no-fund --no-optional

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json

      - name: Commit & push regenerated lockfile (optional)
        if: github.event.inputs.commit == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate package-lock.json (CI)" || echo 'nothing to commit'
          git push
